<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RakuNovel は移転しました</title>
  <meta name="description" content="RakuNovel は新しい公開URLへ移転しました。">
  <style>
    :root {
      color-scheme: light;
      --bg: #fbf8f4;
      --paper: #ffffff;
      --text: #27211f;
      --muted: #6f625d;
      --brand: #8b1a3a;
      --brand-dark: #68122a;
      --border: #eadfd8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      line-height: 1.75;
    }

    main {
      width: min(100%, 680px);
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: clamp(28px, 6vw, 48px);
      box-shadow: 0 18px 50px rgba(70, 45, 32, 0.08);
    }

    .brand {
      margin: 0 0 14px;
      color: var(--brand);
      font-size: clamp(32px, 8vw, 54px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(22px, 5vw, 32px);
      line-height: 1.35;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 16px;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 18px;
      min-height: 48px;
      padding: 12px 22px;
      border-radius: 8px;
      background: var(--brand);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    a.button:focus,
    a.button:hover {
      background: var(--brand-dark);
    }

    .url {
      margin-top: 18px;
      overflow-wrap: anywhere;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">RakuNovel</p>
    <h1>RakuNovel は移転しました</h1>
    <p>現在のRakuNovelは、下記のURLで公開しています。</p>
    <p>ブックマークしている場合は、新しいURLへ変更してください。</p>
    <a class="button" href="https://rakunovel.vercel.app/">RakuNovelを開く</a>
    <p class="url">https://rakunovel.vercel.app/</p>
  </main>
</body>
</html>
